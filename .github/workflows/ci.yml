name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests:
    name: Pruebas automatizadas
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3001
      MONGO_KEY_TEST: mongodb://127.0.0.1:27017/shipnow_test

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Ejecutar las pruebas
        run: pnpm test

  docker:
    name: Construccion de Docker
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Validar Docker Compose
        run: docker compose config

      - name: Construir la imagen
        run: docker build --file Dockerfile --tag shipnow-api:ci .
