paths:
  /api/users:
    get:
      tags:
        - Users
      summary: Get all users
      parameters:
        - $ref: "#/components/Parameters/PageQueryParam"
      responses:
        "200":
          $ref: "#/components/GoodResponses/GetAllUsersResponse"
        "400":
          $ref: "#/components/BadResponses/BadRequestResponse"
    post:
      tags:
        - Users
      summary: Create an user.
      requestBody:
        $ref: "#/components/RequestBodies/CreateUserRequest"
      description: Endpoint to create and return a user
      responses:
        "201":
          $ref: "#/components/GoodResponses/CreateUserResponse"
        "400":
          $ref: "#/components/BadResponses/BadRequestResponse"
        "409":
          $ref: "#/components/BadResponses/DuplicateKeyResponse"

  /api/users/role:
    get:
      tags:
        - Users
      summary: Get user by role.
      parameters:
        - $ref: "#/components/Parameters/RoleQueryParam"
      description: Returns a users by their role.
      responses:
        "200":
          $ref: "#/components/GoodResponses/GetUserByRoleResponse"
        "400":
          $ref: "#/components/BadResponses/BadRequestResponse"
        "422":
          $ref: "#/components/BadResponses/ValidationErrorResponse"
        "404":
          $ref: "#/components/BadResponses/NotFoundResponse"

  /api/users/email:
    get:
      tags:
        - Users
      summary: Get user by email.
      parameters:
        - $ref: "#/components/Parameters/EmailQueryParam"
      description: >
        Returns a user by their email. Warning: This method returns the password because it is used for authentication purposes; it is a route originally protected by role and cannot be accessed by anyone other than administrators. 
      responses:
        "200":
          $ref: "#/components/GoodResponses/GetUserByEmailResponse"
        "404":
          $ref: "#/components/BadResponses/NotFoundResponse"

  /api/users/{uid}:
    get:
      tags:
        - Users
      summary: Get user by UID (User ID)
      parameters:
        - $ref: "#/components/Parameters/UidPathParam"
      description: Returns a user by their ID.
      responses:
        "200":
          $ref: "#/components/GoodResponses/GetUserByIdResponse"
        "400":
          $ref: "#/components/BadResponses/InvalidIdResponse"
        "404":
          $ref: "#/components/BadResponses/NotFoundResponse"

    put:
      tags:
        - Users
      summary: Update a user and optionally upload one document.
      parameters:
        - $ref: "#/components/Parameters/UidPathParam"
      requestBody:
        $ref: "#/components/RequestBodies/UpdateUserRequest"
      description: >
        Updates one or more user fields. For a document upload, use multipart/form-data with the documents file field and documentType. Only one file is accepted per request; PNG, JPEG and PDF are allowed up to 5 MB. A user can store up to 3 documents. courier_license is valid only for a courier.
      responses:
        "200":
          $ref: "#/components/GoodResponses/UpdateUserResponse"
        "400":
          $ref: "#/components/BadResponses/DocumentUpdateBadRequestResponse"
        "409":
          $ref: "#/components/BadResponses/DuplicateKeyResponse"
        "413":
          $ref: "#/components/BadResponses/FileTooLargeResponse"
        "422":
          $ref: "#/components/BadResponses/ValidationErrorResponse"
        "404":
          $ref: "#/components/BadResponses/NotFoundResponse"

    delete:
      tags:
        - Users
      summary: Find by ID and delete user.
      parameters:
        - $ref: "#/components/Parameters/UidPathParam"
      description: >
        Finds and returns an deleted object.
      responses:
        "200":
          $ref: "#/components/GoodResponses/DeletedUserResponse"
        "400":
          $ref: "#/components/BadResponses/InvalidIdResponse"
        "404":
          $ref: "#/components/BadResponses/NotFoundResponse"
