paths:
  /api/orders:
    get:
      tags:
        - Orders
      summary: Get all orders
      responses:
        "200":
          $ref: "#/components/GoodResponses/GetAllOrdersResponse"
    post:
      tags:
        - Orders
      summary: Create an order
      requestBody:
        $ref: "#/components/RequestBodies/CreateOrderRequest"
      responses:
        "201":
          $ref: "#/components/GoodResponses/CreateOrderResponse"
        "400":
          $ref: "#/components/BadResponses/BadRequestResponse"
        "404":
          $ref: "#/components/BadResponses/NotFoundResponse"
        "422":
          $ref: "#/components/BadResponses/ValidationErrorResponse"

  /api/orders/{oid}:
    get:
      tags:
        - Orders
      summary: Get order by ID
      parameters:
        - $ref: "#/components/Parameters/OidPathParam"
      responses:
        "200":
          $ref: "#/components/GoodResponses/GetOrderByIdResponse"
        "404":
          $ref: "#/components/BadResponses/NotFoundResponse"
    put:
      tags:
        - Orders
      summary: Find by ID and update an order
      parameters:
        - $ref: "#/components/Parameters/OidPathParam"
      requestBody:
          $ref: "#/components/RequestBodies/UpdateOrderRequest"
      responses:
        "200":
          $ref: "#/components/GoodResponses/UpdateOrderResponse"
        "400":
          $ref: "#/components/BadResponses/BadRequestResponse"
        "404":
          $ref: "#/components/BadResponses/NotFoundResponse"
        "422":
          $ref: "#/components/BadResponses/ValidationErrorResponse"
    delete:
      tags:
        - Orders
      summary: Find by ID and delete an order
      parameters:
        - $ref: "#/components/Parameters/OidPathParam"
      responses:
        "200":
          $ref: "#/components/GoodResponses/DeleteOrderResponse"
        "404":
          $ref: "#/components/BadResponses/NotFoundResponse"