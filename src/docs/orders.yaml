paths:
  /api/orders:
    get:
      tags:
        - Orders
      summary: Get all orders
      responses:
        "200":
          $ref: "#/components/GoodResponses/GetAllOrdersResponse"
    post:
      tags:
        - Orders
      summary: Create an order
      requestBody:
        $ref: "#/components/RequestBodies/CreateOrderRequest"
      responses:
        "201":
          $ref: "#/components/GoodResponses/CreateOrderResponse"
        "400":
          $ref: "#/components/BadResponses/BadRequestResponse"
        "404":
          $ref: "#/components/BadResponses/NotFoundResponse"
        "422":
          $ref: "#/components/BadResponses/ValidationErrorResponse"

  /api/orders/{oid}:
    get:
      tags:
        - Orders
      summary: Get order by ID
      parameters:
        - $ref: "#/components/Parameters/OidPathParam"
      responses:
        "200":
          $ref: "#/components/GoodResponses/GetOrderByIdResponse"
        "400":
          $ref: "#/components/BadResponses/InvalidIdResponse"
        "404":
          $ref: "#/components/BadResponses/NotFoundResponse"
    put:
      tags:
        - Orders
      summary: Update an order and optionally upload one payment receipt
      parameters:
        - $ref: "#/components/Parameters/OidPathParam"
      requestBody:
        $ref: "#/components/RequestBodies/UpdateOrderRequest"
      description: >
        Updates one or more order fields. For a receipt upload, use multipart/form-data with the documents file field and documentType: payment_receipt. Only one file is accepted per request; PNG, JPEG and PDF are allowed up to 5 MB. An order can store up to 3 documents.
      responses:
        "200":
          $ref: "#/components/GoodResponses/UpdateOrderResponse"
        "400":
          $ref: "#/components/BadResponses/DocumentUpdateBadRequestResponse"
        "409":
          $ref: "#/components/BadResponses/DuplicateKeyResponse"
        "413":
          $ref: "#/components/BadResponses/FileTooLargeResponse"
        "404":
          $ref: "#/components/BadResponses/NotFoundResponse"
        "422":
          $ref: "#/components/BadResponses/ValidationErrorResponse"
    delete:
      tags:
        - Orders
      summary: Find by ID and delete an order
      parameters:
        - $ref: "#/components/Parameters/OidPathParam"
      responses:
        "200":
          $ref: "#/components/GoodResponses/DeleteOrderResponse"
        "400":
          $ref: "#/components/BadResponses/InvalidIdResponse"
        "404":
          $ref: "#/components/BadResponses/NotFoundResponse"
