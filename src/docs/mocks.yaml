paths:
  /api/mocks/deliveries:
    get:
      tags:
        - Mocks
      summary: Get delivery mocks
      parameters:
        - $ref: "#/components/Parameters/CountQueryParam"
      responses:
        "200":
          $ref: "#/components/GoodResponses/MockingDeliveriesResponse"
        "400":
          $ref: "#/components/BadResponses/InvalidMockCountResponse"
        "404":
          $ref: "#/components/BadResponses/MockDataNotFoundResponse"
    post:
      tags:
        - Mocks
      summary: Get delivery mocks and save to database
      requestBody:
        $ref: "#/components/RequestBodies/SaveToDbAndCountRequest"
      responses:
        "201":
          $ref: "#/components/GoodResponses/GenerateDeliveriesResponse"
        "400":
          $ref: "#/components/BadResponses/InvalidMockCountResponse"
        "404":
          $ref: "#/components/BadResponses/MockDataNotFoundResponse"

  /api/mocks/orders:
    get:
      tags:
        - Mocks
      summary: Get order mocks
      parameters:
        - $ref: "#/components/Parameters/CountQueryParam"
      responses:
        "200":
          $ref: "#/components/GoodResponses/MockingOrdersResponse"
        "400":
          $ref: "#/components/BadResponses/InvalidMockCountResponse"
        "404":
          $ref: "#/components/BadResponses/MockDataNotFoundResponse"
    post:
      tags:
        - Mocks
      summary: Get order mocks and save to database
      requestBody:
        $ref: "#/components/RequestBodies/SaveToDbAndCountRequest"
      responses:
        "201":
          $ref: "#/components/GoodResponses/GenerateOrdersResponse"
        "400":
          $ref: "#/components/BadResponses/InvalidMockCountResponse"
        "404":
          $ref: "#/components/BadResponses/MockDataNotFoundResponse"

  /api/mocks/users:
    get:
      tags:
        - Mocks
      summary: Get user mocks
      parameters:
        - $ref: "#/components/Parameters/CountQueryParam"
      responses:
        "200":
          $ref: "#/components/GoodResponses/MockingUsersResponse"
        "400":
          $ref: "#/components/BadResponses/InvalidMockCountResponse"
    post:
      tags:
        - Mocks
      summary: Get user mocks and save to database
      requestBody:
        $ref: "#/components/RequestBodies/SaveToDbAndCountRequest"
      responses:
        "201":
          $ref: "#/components/GoodResponses/GenerateUsersResponse"
        "400":
          $ref: "#/components/BadResponses/InvalidMockCountResponse"